services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ProyectoM}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      Sembrado__CorreoAdmin: ${ADMIN_EMAIL:-admin@proyectom.com}
      Sembrado__ContrasenaAdmin: ${ADMIN_PASSWORD:-password}
      ConfiguracionJwt__ClaveSecreta: ${JWT_SECRET:-koNGJ89L4gn9w@0ifAsmf#opdZsgmx_O}
      ConnectionStrings__ConexionPrincipal: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-ProyectoM};Uid=root;Pwd=${MYSQL_ROOT_PASSWORD:-password};"
      Almacenamiento__RutaRaiz: /app/storage
    ports:
      - "${API_PORT:-5239}:8080"
    volumes:
      - files_data:/app/storage

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8081}:80"

volumes:
  db_data:
  files_data:
