# ---------------------------------------------------------------------------
# Servicios del proyecto: la base de datos, la API, el frontend y los volúmenes
# que hacen persistentes tanto la base de datos como los archivos que suben los
# usuarios.
#
# Formas de uso:
#
#   docker compose up -d
#       Levanta TODA la aplicación entregable: base de datos + API + frontend.
#       Es el comando que debe usar cualquiera que clone el repositorio. Al
#       terminar, la aplicación se abre en http://localhost:5173
#
#   docker compose up -d mysql
#       Levanta solo la base de datos, para trabajar la API con "dotnet run" y el
#       frontend con "npm run dev" (modo desarrollo).
#
#   docker compose --profile microservicios up -d
#       Levanta además los microservicios de la carpeta Services/. NO entra en el
#       comando normal a propósito: están marcados con un "profile", así que
#       docker compose los ignora salvo que se pidan de forma explícita. De esta
#       forma el arranque normal no depende de ellos. Este es el "punto y aparte"
#       de la transición a microservicios.
# ---------------------------------------------------------------------------

services:
  # Service Discovery - Consul
  #
  # A partir de aquí, todos los servicios marcados con "profiles" pertenecen a la
  # transición a microservicios y quedan fuera del arranque normal.
  consul:
    profiles: ["microservicios"]
    image: consul:1.19
    container_name: proyectom-consul
    restart: unless-stopped
    ports:
      - "${CONSUL_HTTP_PORT:-8500}:8500"
      - "${CONSUL_DNS_PORT:-8600}:8600/udp"
    command: agent -server -ui -bootstrap-expect=1 -client=0.0.0.0
    volumes:
      - consul_data:/consul/data
    healthcheck:
      test: ["CMD", "consul", "members"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Message Broker - RabbitMQ
  rabbitmq:
    profiles: ["microservicios"]
    image: rabbitmq:3.13-management
    container_name: proyectom-rabbitmq
    restart: unless-stopped
    ports:
      - "${RABBITMQ_AMQP_PORT:-5672}:5672"
      - "${RABBITMQ_MGMT_PORT:-15672}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Config Server - Spring Cloud Config Server
  config-server:
    profiles: ["microservicios"]
    image: springcloud/configserver:4.1.3
    container_name: proyectom-config-server
    restart: unless-stopped
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:8888"
    environment:
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: ${CONFIG_GIT_URI:-https://github.com/example/config-repo}
      SPRING_CLOUD_CONFIG_SERVER_GIT_SEARCH_PATHS: ${CONFIG_SEARCH_PATHS:-configs}
    volumes:
      - config_data:/config
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base de datos MySQL para el servicio principal (monolito)
  mysql:
    image: mysql:8.4
    container_name: proyectom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-ProyectoM}
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      # Volumen nombrado: los datos sobreviven a "docker compose down" y a recrear el contenedor.
      - db_data:/var/lib/mysql
    healthcheck:
      # La API espera a que la base responda antes de arrancar.
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Base de datos MySQL para el Servicio de Autenticación
  mysql-auth:
    profiles: ["microservicios"]
    image: mysql:8.4
    container_name: proyectom-mysql-auth
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: AuthDB
    ports:
      - "${MYSQL_AUTH_PORT:-3307}:3306"
    volumes:
      - db_auth_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Servicio de Autenticación (Auth Service)
  auth-service:
    profiles: ["microservicios"]
    build:
      context: ./Services/AuthService
      dockerfile: Dockerfile
    container_name: proyectom-auth-service
    restart: unless-stopped
    depends_on:
      mysql-auth:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql-auth;Port=3306;Database=AuthDB;Uid=root;Pwd=${MYSQL_ROOT_PASSWORD:-password};"
      Jwt__Key: "clave_secreta_muy_larga_para_seguridad_del_token_jwt_auth_service_2024"
      Jwt__Issuer: "AuthService"
      Jwt__Audience: "MicroserviciosDrive"
      Consul__Address: "http://consul:8500"
      Service__Address: "auth-service"
      Service__Port: "5001"
    ports:
      - "${AUTH_SERVICE_PORT:-5001}:5001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base de datos MySQL para el Servicio de Usuarios
  mysql-users:
    profiles: ["microservicios"]
    image: mysql:8.4
    container_name: proyectom-mysql-users
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: UsersDB
    ports:
      - "${MYSQL_USERS_PORT:-3308}:3306"
    volumes:
      - db_users_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Servicio de Usuarios (Users Service)
  users-service:
    profiles: ["microservicios"]
    build:
      context: ./Services/UsersService
      dockerfile: Dockerfile
    container_name: proyectom-users-service
    restart: unless-stopped
    depends_on:
      mysql-users:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql-users;Port=3306;Database=UsersDB;Uid=root;Pwd=${MYSQL_ROOT_PASSWORD:-password};"
      Consul__Address: "http://consul:8500"
      Service__Address: "users-service"
      Service__Port: "5002"
    ports:
      - "${USERS_SERVICE_PORT:-5002}:5002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base de datos MySQL para el Servicio de Directorios
  mysql-directories:
    profiles: ["microservicios"]
    image: mysql:8.4
    container_name: proyectom-mysql-directories
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: DirectoriesDB
    ports:
      - "${MYSQL_DIRECTORIES_PORT:-3309}:3306"
    volumes:
      - db_directories_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Servicio de Directorios (Directories Service)
  directories-service:
    profiles: ["microservicios"]
    build:
      context: ./Services/DirectoriesService
      dockerfile: Dockerfile
    container_name: proyectom-directories-service
    restart: unless-stopped
    depends_on:
      mysql-directories:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql-directories;Port=3306;Database=DirectoriesDB;Uid=root;Pwd=${MYSQL_ROOT_PASSWORD:-password};"
      Consul__Address: "http://consul:8500"
      Service__Address: "directories-service"
      Service__Port: "5003"
    ports:
      - "${DIRECTORIES_SERVICE_PORT:-5003}:5003"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5003/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Base de datos MySQL para el Servicio de Archivos
  mysql-files:
    profiles: ["microservicios"]
    image: mysql:8.4
    container_name: proyectom-mysql-files
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-password}
      MYSQL_DATABASE: FilesDB
    ports:
      - "${MYSQL_FILES_PORT:-3310}:3306"
    volumes:
      - db_files_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-password}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Servicio de Archivos (Files Service)
  files-service:
    profiles: ["microservicios"]
    build:
      context: ./Services/FilesService
      dockerfile: Dockerfile
    container_name: proyectom-files-service
    restart: unless-stopped
    depends_on:
      mysql-files:
        condition: service_healthy
      consul:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: "Server=mysql-files;Port=3306;Database=FilesDB;Uid=root;Pwd=${MYSQL_ROOT_PASSWORD:-password};"
      Almacenamiento__RutaRaiz: /app/storage
      Consul__Address: "http://consul:8500"
      Service__Address: "files-service"
      Service__Port: "5004"
    ports:
      - "${FILES_SERVICE_PORT:-5004}:5004"
    volumes:
      - files_service_data:/app/storage
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5004/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Gateway
  gateway:
    profiles: ["microservicios"]
    build:
      context: ./Services/Gateway
      dockerfile: Dockerfile
    container_name: proyectom-gateway
    restart: unless-stopped
    depends_on:
      consul:
        condition: service_healthy
      auth-service:
        condition: service_healthy
      users-service:
        condition: service_healthy
      directories-service:
        condition: service_healthy
      files-service:
        condition: service_healthy
    ports:
      - "${GATEWAY_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API del repositorio. Se construye con el Dockerfile de la raíz del proyecto.
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: proyectom-api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      # Modo de ejecución. Se deja en Development para que los mensajes de error de la
      # API sigan siendo detallados. Ya no habilita ninguna interfaz gráfica: OpenAPI y
      # Scalar se retiraron del proyecto.
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # Dentro de la red de Docker la base de datos se llama "mysql" y no "localhost".
      # El nombre de la variable es "Sección__Clave" y debe coincidir con appsettings.json.
      ConnectionStrings__ConexionPrincipal: "Server=mysql;Port=3306;Database=${MYSQL_DATABASE:-ProyectoM};Uid=root;Pwd=${MYSQL_ROOT_PASSWORD:-password};"
      # Los archivos subidos se guardan en la ruta montada por el volumen "files_data".
      Almacenamiento__RutaRaiz: /app/storage
      # ---------------------------------------------------------------------------
      # Origen autorizado a llamar a la API (CORS).
      #
      # El índice "__0" es la forma de escribir el primer elemento de un arreglo en
      # una variable de entorno: equivale a "Cors:OrigenesPermitidos[0]".
      #
      # Si el frontend se publica en otra dirección (otro dominio o puerto), basta con
      # definir FRONTEND_ORIGIN en el archivo .env; no hay que recompilar nada.
      # ---------------------------------------------------------------------------
      Cors__OrigenesPermitidos__0: ${FRONTEND_ORIGIN:-http://localhost:5173}
      # ---------------------------------------------------------------------------
      # Clave con la que se firman los JWT.
      #
      # Se pasa por variable de entorno para que el valor real no viva en el archivo de
      # configuración versionado en Git. El valor de "appsettings.json" sigue existiendo
      # como respaldo para quien trabaja en local con "dotnet run".
      #
      # El nombre de la variable debe respetar el doble guion bajo: "Sección__Clave".
      # ---------------------------------------------------------------------------
      ConfiguracionJwt__ClaveSecreta: ${JWT_CLAVE_SECRETA:-koNGJ89L4gn9w@0ifAsmf#opdZsgmx_O}
    ports:
      - "${API_PORT:-5239}:8080"
    volumes:
      - files_data:/app/storage

  # ---------------------------------------------------------------------------
  # Frontend: la interfaz que usa el usuario en el navegador.
  #
  # Se construye con el Dockerfile de la carpeta del frontend, que en una primera
  # etapa compila el proyecto con Vite y en una segunda lo sirve con nginx.
  #
  # Por qué se publica en el 5173: es el mismo puerto que usa el servidor de
  # desarrollo de Vite, así que la dirección de la aplicación y la configuración de
  # CORS del backend son iguales en el flujo de Docker y en el flujo de desarrollo.
  # Dentro del contenedor nginx escucha en el 80.
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ./MicroserviciosProyectoApp
      dockerfile: Dockerfile
      args:
        # Dirección de la API que usará el NAVEGADOR del usuario. Debe ser una
        # dirección alcanzable desde la máquina donde se abre el navegador, no el
        # nombre interno del contenedor.
        #
        # Vite la escribe dentro del JavaScript al compilar, así que cambiar este
        # valor exige reconstruir la imagen: "docker compose build frontend".
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5239/api}
    container_name: proyectom-frontend
    restart: unless-stopped
    # Solo para respetar el orden de arranque (la API primero). nginx no necesita a la
    # API para servir los archivos; es el navegador quien llama a la API después.
    depends_on:
      - api
    ports:
      - "${FRONTEND_PORT:-5173}:80"

volumes:
  db_data:
  files_data:
  consul_data:
  rabbitmq_data:
  config_data:
  db_auth_data:
  db_users_data:
  db_directories_data:
  db_files_data:
  files_service_data:
