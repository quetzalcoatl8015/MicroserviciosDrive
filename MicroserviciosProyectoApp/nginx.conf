# ---------------------------------------------------------------------------
# Configuración de nginx para el frontend.
#
# nginx sirve los archivos ya compilados por Vite. No hay servidor de
# aplicaciones: React se ejecuta completo en el navegador del usuario.
#
# El detalle importante de este archivo es el "try_files" de la sección "/":
# la aplicación usa rutas del navegador (/login, /registro, /repositorio,
# /usuarios) que NO existen como archivos en el disco. Sin esa línea, al
# recargar la página en /repositorio nginx respondería 404 porque buscaría un
# archivo llamado "repositorio". Con "try_files ... /index.html" cualquier
# dirección desconocida entrega index.html y deja que React Router decida qué
# pantalla mostrar.
# ---------------------------------------------------------------------------

server {
    listen 80;
    server_name _;

    # Carpeta donde la etapa de compilación dejó los archivos estáticos.
    root /usr/share/nginx/html;
    index index.html;

    # Compresión de las respuestas de texto: reduce el tamaño del JavaScript y
    # del CSS que descarga el navegador.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Rutas de la aplicación (SPA).
    #
    #   $uri     -> el archivo pedido, si existe (por ejemplo /favicon.ico)
    #   $uri/    -> el directorio pedido, si existe
    #   /index.html -> si no existe nada de lo anterior, se entrega la aplicación
    #                  y React Router resuelve la dirección
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Los archivos de /assets/ llevan un hash en el nombre que cambia con cada
    # compilación, así que se pueden cachear de forma agresiva sin riesgo de
    # servir una versión vieja.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # El index.html nunca se cachea: es el que apunta a los archivos con hash y
    # debe reflejar siempre la última compilación.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
